name: Build SoundPhysicsLite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build SoundPhysicsLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-26"
          sdkmanager "ndk;27.2.12479018"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Checking required files ==="
          test -f CMakeLists.txt
          test -f manifest.json
          test -d src

          echo "Project structure OK"

      - name: Verify NDK
        run: |
          echo "NDK = $ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID=1 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Package LEVIPACK
        run: |
          mkdir -p dist

          if [ -f package.sh ]; then
            chmod +x package.sh
            ./package.sh
          else
            echo "package.sh not found."
            echo "Creating fallback package..."

            cp manifest.json dist/

            if [ -d config ]; then
              cp -r config dist/
            fi

            if [ -d build ]; then
              cp -r build dist/
            fi

            cd dist
            zip -r ../SoundPhysicsLite.levipack .
            cd ..
          fi

      - name: Find LEVIPACK
        if: always()
        run: |
          echo "=== LEVIPACK ==="
          find . -type f -name "*.levipack" -print

      - name: Upload LEVIPACK
        uses: actions/upload-artifact@v4
        with:
          name: SoundPhysicsLite-ARM64
          path: "**/*.levipack"
          if-no-files-found: error
