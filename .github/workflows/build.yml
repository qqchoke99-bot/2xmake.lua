name: Build SPL.levipack (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file unzip

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          test -f "${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake"

      - name: CMake configure (arm64-v8a)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DLEVI_LINK_PRELOADER=ON

      - name: CMake build + package
        run: |
          cmake --build build --parallel
          # levi_package is ALL dependency of build if configured; ensure it runs
          cmake --build build --target levi_package --parallel || true

      - name: Locate outputs
        id: outs
        run: |
          set -e
          echo "== build tree =="
          find build -name 'libSoundPhysicsLite.so' -o -name 'SPL.levipack' | sort

          SO=$(find build -name 'libSoundPhysicsLite.so' | head -n1)
          if [ -z "$SO" ]; then
            echo "::error::libSoundPhysicsLite.so was not produced. Compilation failed or wrong target name."
            exit 1
          fi

          echo "Checking ELF architecture:"
          file "$SO"
          file "$SO" | grep -qi 'ARM aarch64\|ARM64\|aarch64' || {
            echo "::error::libSoundPhysicsLite.so is not ARM aarch64"
            file "$SO"
            exit 1
          }

          PACK=$(find build -name 'SPL.levipack' | head -n1)
          if [ -z "$PACK" ]; then
            echo "SPL.levipack missing — packaging manually"
            mkdir -p pack
            cp "$SO" pack/libSoundPhysicsLite.so
            cp manifest.json pack/
            cp icon.png pack/
            (cd pack && zip -r ../SPL.levipack manifest.json libSoundPhysicsLite.so icon.png)
            PACK="$PWD/SPL.levipack"
          fi

          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          echo "so=$SO" >> "$GITHUB_OUTPUT"
          unzip -l "$PACK"

      - name: Upload SPL.levipack
        uses: actions/upload-artifact@v4
        with:
          name: SPL-levipack-arm64
          path: ${{ steps.outs.outputs.pack }}
          if-no-files-found: error
