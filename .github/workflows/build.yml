name: Build SoundPhysicsLite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build SoundPhysicsLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r27c

      - name: Check project
        run: |
          test -f CMakeLists.txt
          test -f manifest.json
          test -d src
          echo "Project structure OK"

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID=1 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package
        run: |
          if [ -f package.sh ]; then
            chmod +x package.sh
            ./package.sh
          else
            mkdir -p dist
            cp manifest.json dist/

            if [ -d config ]; then
              cp -r config dist/
            fi

            if [ -d build ]; then
              cp -r build dist/
            fi

            cd dist
            zip -r ../SoundPhysicsLite.levipack .
          fi

      - name: Show output
        if: always()
        run: |
          echo "=== Build output ==="
          find build -type f 2>/dev/null || true
          echo "=== LEVIPACK ==="
          find . -name "*.levipack" -type f

      - name: Upload LEVIPACK
        uses: actions/upload-artifact@v4
        with:
          name: SoundPhysicsLite-ARM64
          path: "**/*.levipack"
          if-no-files-found: error
